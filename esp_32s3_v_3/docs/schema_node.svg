<circle cx="920" cy="550" r="3.5" fill="#1f2328"/>
<text x="928" y="554" font-size="11.5" text-anchor="start" fill="#1f2328">VCC (див. примітку)</text>
<circle cx="920" cy="575" r="3.5" fill="#1f2328"/>
<text x="928" y="579" font-size="11.5" text-anchor="start" fill="#1f2328">GND</text>
<text x="920" y="670" font-size="11.5" text-anchor="start" fill="#57606a">TFT на SPI2, SD на SPI3: шини не пов'язані.</text>
<text x="920" y="686" font-size="11.5" text-anchor="start" fill="#57606a">GPIO3 (strapping) і GPIO48 (на деяких платах</text>
<text x="920" y="702" font-size="11.5" text-anchor="start" fill="#57606a">світлодіод) вільні для SD. SD-модуль зі</text>
<text x="920" y="718" font-size="11.5" text-anchor="start" fill="#57606a">стабілізатором: VCC 5 В; голий слот — 3,3 В.</text>
<text x="920" y="734" font-size="11.5" text-anchor="start" fill="#57606a">Лінії SPI ≤ 15 см; CS підтягніть 10 кΩ до 3V3.</text>
<text x="920" y="750" font-size="11.5" text-anchor="start" fill="#57606a">Живлення: USB-C 5 В, ≥ 1 А (Wi-Fi + камера</text>
<text x="920" y="766" font-size="11.5" text-anchor="start" fill="#57606a">дають піки струму). Спільний GND усіх модулів.</text>
