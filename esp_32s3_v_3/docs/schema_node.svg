<text x="60" y="500" font-size="11.5" text-anchor="start" fill="#57606a">VCC → 3V3,  GND → GND</text>
<text x="60" y="516" font-size="11.5" text-anchor="start" fill="#57606a">RET (RESET) → 3V3,  PWDN → GND</text>
<text x="60" y="532" font-size="11.5" text-anchor="start" fill="#57606a">XCLK 10 МГц; SIOD/SIOC: 4,7 кΩ до 3V3,</text>
<text x="60" y="548" font-size="11.5" text-anchor="start" fill="#57606a">якщо камера не знаходиться</text>
<text x="60" y="564" font-size="11.5" text-anchor="start" fill="#57606a">Дроти D0–D7, PCLK, XCLK ≤ 10 см</text>
<text x="60" y="580" font-size="11.5" text-anchor="start" fill="#57606a">10 мкФ + 100 нФ біля VCC камери</text>
