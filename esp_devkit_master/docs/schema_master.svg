<path d="M270,490 L330,490" fill="none" stroke="#57606a" stroke-width="2.2" stroke-linejoin="round"/>
<text x="970" y="100" font-size="11.5" text-anchor="start" fill="#57606a">Підтяжки I2C: внутрішні (увімкнені в коді).</text>
<text x="970" y="116" font-size="11.5" text-anchor="start" fill="#57606a">Модулі DS1307 часто мають підтяжки до 5 В:</text>
<text x="970" y="132" font-size="11.5" text-anchor="start" fill="#57606a">краще DS3231 або зніміть резистори,</text>
<text x="970" y="148" font-size="11.5" text-anchor="start" fill="#57606a">інакше 5 В потрапить на піни ESP32.</text>
<text x="970" y="255" font-size="11.5" text-anchor="start" fill="#57606a">Wi-Fi + SNTP + Open-Meteo — на цій платі:</text>
<text x="970" y="271" font-size="11.5" text-anchor="start" fill="#57606a">антена вбудована, Wi-Fi 2,4 ГГц.</text>
<text x="970" y="287" font-size="11.5" text-anchor="start" fill="#57606a">Живлення USB 5 В, ≥ 500 мА.</text>
<text x="970" y="200" font-size="11.5" text-anchor="start" fill="#57606a">Піни I2C у STM32 — як у вашому CubeMX</text>
<text x="970" y="216" font-size="11.5" text-anchor="start" fill="#57606a">(зазвичай PB6 SCL / PB7 SDA).</text>
<text x="970" y="520" font-size="11.5" text-anchor="start" fill="#57606a">PIR: AM312 живити 3,3 В;</text>
<text x="970" y="536" font-size="11.5" text-anchor="start" fill="#57606a">HC-SR501 — 5 В (вихід 3,3 В),</text>
<text x="970" y="552" font-size="11.5" text-anchor="start" fill="#57606a">тоді VCC беріть з пина 5V плати.</text>
<text x="970" y="650" font-size="11.5" text-anchor="start" fill="#d1242f">Кнопки (мВ): RIGHT 0, UP 430, DOWN 990,</text>
<text x="970" y="666" font-size="11.5" text-anchor="start" fill="#d1242f">LEFT 1540, SELECT 2380, вільно ≈3,1 В.</text>
<text x="970" y="682" font-size="11.5" text-anchor="start" fill="#d1242f">ADKeyboard живити ЛИШЕ від 3,3 В.</text>
<text x="970" y="698" font-size="11.5" text-anchor="start" fill="#d1242f">Інші номінали: утримуйте кнопку</text>
<text x="970" y="714" font-size="11.5" text-anchor="start" fill="#d1242f">при вмиканні — калібрування.</text>
<text x="415" y="550" font-size="11" text-anchor="middle" fill="#8250df" font-weight="bold">GPIO17 TX → GPIO18 RX</text>
<text x="415" y="566" font-size="11" text-anchor="middle" fill="#8250df" font-weight="bold">GPIO16 RX ← GPIO17 TX</text>
<text x="415" y="582" font-size="11" text-anchor="middle" fill="#57606a" font-weight="bold">спільний GND обов'язковий</text>
